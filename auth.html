<!DOCTYPE html>
<html>
    <head>
        <title>Flowdiary Coding Challenge</title>
        <style>
            * {
                padding: 0px;
                margin: 0px;
            }

            body {
                background-color: #f5f5f5;
            }

            h1 {
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                background-color: midnightblue;
                color: white;
                padding-top: 30px;
                padding-bottom: 30px;
            }

            form {
                position: fixed;
                left: 40%;
                background-color: skyblue;
                margin-top: 50px;
                width: 300px;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 2px 2px 0px;
            }

            .input_deg {
                margin-bottom: 25px;
            }

            label {
                display: inline-block;
                text-align: right;
                color: midnightblue;
                font-weight: bold;
            }

            .input {
                border-style: none;
                border-radius: 10px;
                width: 200px;
                height: 20px;
                padding-left: 10px;
                margin-left: 10px;
            }

            input::placeholder {
                color: midnightblue;
            }
            
            .submit {
                width: 70px;
                border-style: none;
                padding: 7px;
                background-color: midnightblue;
                color: white;
            }

            .submit:hover {
                background-color: white;
                color: midnightblue;
            }

            .submit1 {
               text-align: center;
            }

        </style>
    </head>
    <body>
        <h1>Welcome to Flowdiary Coding Challenge Webinar</h1><br><br>

        <form onsubmit="return validateAuthForm()">
            <div class="input_deg">
                <label>Username:</label>
                <input class="input" type="email" name="email" id="email" placeholder="Enter Email Address">
            </div>

            <div class="input_deg">
                <label>Password:</label>
                <input class="input" type="password" name="password" id="password" placeholder="Enter Password">
            </div>

            <div class="submit1">
                <input class="submit" type="submit" value="Login">
            </div>
        </form>
    </body>
</html>
